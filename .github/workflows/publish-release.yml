name: Publish RAVLAN Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (example: 1.2.5)'
        required: true
        default: '1.5.5'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout distribution
        uses: actions/checkout@v4
      - name: Validate manifest and requested version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, sys
          version = os.environ["RELEASE_VERSION"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              sys.exit("Invalid version")
          manifest = json.loads(pathlib.Path("version.json").read_text())
          if manifest["version"] != version:
              sys.exit("Requested version does not match version.json")
          for name, expected in manifest["files"].items():
              data = pathlib.Path(name).read_bytes()
              actual = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              if actual != expected:
                  sys.exit(f"Manifest mismatch: {name}")
          print("All release files match manifest.")
          PY
      - name: Check Python syntax
        run: python3 -m py_compile telnet_manager.py ssh_password.py
      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          foreach ($path in @('install.ps1', 'update.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parser errors in $path"
            }
          }
      - name: Verify RAVLAN launchers
        shell: bash
        run: |
          grep -F "'rv.cmd'" install.ps1
          grep -F "'np.cmd'" install.ps1
          grep -F 'ravlan-releases' update.ps1
      - name: Build distribution archive
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist
          zip -j "dist/RAVLAN-${RELEASE_VERSION}-Windows.zip" INSTALL.bat install.ps1 telnet_manager.py ssh_password.py requirements.txt update.ps1 version.json
          sha256sum "dist/RAVLAN-${RELEASE_VERSION}-Windows.zip" > "dist/SHA256SUMS.txt"
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Release v${RELEASE_VERSION} already exists. Refusing to overwrite."
            exit 1
          fi
          gh release create "v${RELEASE_VERSION}" dist/* --title "RAVLAN v${RELEASE_VERSION}" --notes-file CHANGELOG.md --latest
